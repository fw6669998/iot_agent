<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Agent · 物联网智能助手</title>
    <link rel="stylesheet" href="/static/css/github-dark.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="app">
    <header>
        <div class="logo">🛠</div>
        <div>
            <h1>IoT Agent</h1>
            <div class="sub">物联网平台智能助手</div>
        </div>
        <div class="session-bar">
            <!--            <select id="sessionSelect"><option value="">新会话</option></select>-->
            <!--            <button id="newSessionBtn" class="primary">+ 新建</button>-->
            <button id="resetBtn">清空</button>
        </div>
    </header>

    <div class="messages" id="messages">
        <div class="empty" id="empty">
            <div class="big">📡</div>
            <div>你可以问我物联网平台相关操作，例如：</div>
            <div style="margin-top:10px">
                <span class="suggestion">查看当前在线设备</span>
                <span class="suggestion">电脑设备锁屏状态</span>
                <span class="suggestion">打开电脑设备远程软件</span>
            </div>
        </div>
        <div class="typing" id="typing"><span></span><span></span><span></span></div>
    </div>

    <div class="input-bar">
        <textarea id="input" placeholder="输入你的请求,  Ctrl/⌘+Enter 发送..." rows="1"></textarea>
        <button class="mic-btn" id="micBtn" title="语音输入">🎙️</button>
        <button class="send-btn" id="sendBtn">发送</button>
    </div>
</div>

<script src="/static/js/marked.min.js"></script>
<script src="/static/js/highlight.min.js"></script>
<script>
    /* ---- Markdown renderer config ---- */
    marked.setOptions({
        breaks: true,
        gfm: true,
        highlight(code, lang) {
            if (lang && hljs.getLanguage(lang)) {
                try {
                    return hljs.highlight(code, {language: lang}).value;
                } catch {
                }
            }
            try {
                return hljs.highlightAuto(code).value;
            } catch {
            }
            return code;
        },
    });

    function renderMarkdown(text) {
        return marked.parse(text || '');
    }

    const $ = id => document.getElementById(id);
    const messagesEl = $('messages');
    const inputEl = $('input');
    const sendBtn = $('sendBtn');
    const typingEl = $('typing');
    const emptyEl = $('empty');
    let currentSession = '';
    let sending = false;
    let streamWrap = null;       // .msg.assistant wrapper (persists across entire response)
    let streamBubble = null;     // .bubble div inside streamWrap
    let currentTextSection = null; // current .text-section being streamed into
    let streamText = '';
    let abortCtrl = null;
    let toolBlocks = {};          // tool_call_id -> 工具块 DOM, 供 tool_result 回填输出

    function startStreamBubble() {
        if (streamWrap) return streamBubble;
        toggleTyping(false);
        streamText = '';
        const wrap = document.createElement('div');
        wrap.className = 'msg assistant';
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = 'AI';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        const textSection = document.createElement('div');
        textSection.className = 'text-section';
        textSection.innerHTML = '<span class="cursor">▋</span>';
        bubble.appendChild(textSection);
        wrap.appendChild(avatar);
        wrap.appendChild(bubble);
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        streamWrap = wrap;
        streamBubble = bubble;
        currentTextSection = textSection;
        return bubble;
    }

    function appendDelta(text) {
        startStreamBubble();
        streamText += text;
        currentTextSection.innerHTML = renderMarkdown(streamText) + '<span class="cursor">▋</span>';
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function finishStreamBubble() {
        if (currentTextSection) {
            currentTextSection.innerHTML = renderMarkdown(streamText);
            // Remove empty text-sections (no visible content after rendering)
            if (!currentTextSection.textContent.trim()) {
                currentTextSection.remove();
            }
        }
        streamWrap = null;
        streamBubble = null;
        currentTextSection = null;
        streamText = '';
    }

    function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function jsonPretty(v) {
        if (typeof v === 'string') return escapeHtml(v);
        try {
            return escapeHtml(JSON.stringify(v, null, 2));
        } catch {
            return escapeHtml(String(v));
        }
    }

    function addBubble(role, html, kind) {
        const wrap = document.createElement('div');
        wrap.className = 'msg ' + (kind || role);
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? '我' : (kind === 'tool' ? '⚙' : 'AI');
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = html;
        wrap.appendChild(avatar);
        wrap.appendChild(bubble);
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return bubble;
    }

    function showTool(name, content) {
        const wrap = document.createElement('div');
        wrap.className = 'msg tool';
        wrap.innerHTML = `
        <div class="avatar">⚙</div>
        <div class="bubble">
            <div class="tool-name">🔧 ${escapeHtml(name)}</div>
            <pre class="tool-output">${jsonPretty(content)}</pre>
        </div>`;
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showError(text) {
        addBubble('error', escapeHtml(text), 'error');
    }

    function appendInlineError(text) {
        startStreamBubble();
        if (currentTextSection) {
            currentTextSection.innerHTML = renderMarkdown(streamText);
            if (!currentTextSection.textContent.trim()) currentTextSection.remove();
        }
        const errEl = document.createElement('div');
        errEl.className = 'error-block';
        errEl.innerHTML = `<span class="error-icon">⚠</span><span>${escapeHtml(text)}</span>`;
        streamBubble.appendChild(errEl);
        currentTextSection = null;
        streamText = '';
        finishStreamBubble();
        setSending(false);
    }

    function toggleTool(header) {
        const body = header.nextElementSibling;
        const isExpanded = header.classList.toggle('expanded');
        body.style.display = isExpanded ? 'block' : 'none';
        const arrow = header.querySelector('.tool-arrow');
        if (arrow) arrow.textContent = isExpanded ? '▾' : '▸';
    }

    function toggleTyping(show) {
        typingEl.classList.toggle('show', show && !sending);
    }

    function setSending(v) {
        sending = v;
        sendBtn.disabled = v;
        toggleTyping(v);
    }

    function handleEvent(data) {
        switch (data.type) {
            case 'session':
                currentSession = data.session_id;
                break;
            case 'tool_call': {
                // 工具调用入参已就绪(工具尚未执行完): 立即展示, 带调用中状态
                startStreamBubble();
                if (currentTextSection) {
                    currentTextSection.innerHTML = renderMarkdown(streamText);
                    if (!currentTextSection.textContent.trim()) {
                        currentTextSection.remove();
                    }
                }
                const toolName = escapeHtml(data.name_cn || data.name || '工具');
                let bodyHtml = '';
                if (data.input != null && !(typeof data.input === 'object' && Object.keys(data.input).length === 0)) {
                    bodyHtml += `<div class="tool-section"><div class="tool-label">输入参数</div><pre>${jsonPretty(data.input)}</pre></div>`;
                }
                const toolBlock = document.createElement('div');
                toolBlock.className = 'tool-block pending';
                toolBlock.innerHTML = `
                <div class="tool-header" onclick="toggleTool(this)" data-name="${toolName}"><span class="tool-arrow">▸</span> 🔧 ${toolName}<span class="tool-status"><span class="tool-spinner"></span>调用中</span></div>
                <div class="tool-body">${bodyHtml}</div>`;
                streamBubble.appendChild(toolBlock);
                toolBlocks[data.id] = toolBlock;
                const newTextSection = document.createElement('div');
                newTextSection.className = 'text-section';
                streamBubble.appendChild(newTextSection);
                currentTextSection = newTextSection;
                streamText = '';
                messagesEl.scrollTop = messagesEl.scrollHeight;
                break;
            }
            case 'tool_result': {
                // 工具执行完, 回填输出; 找不到块(漏报 tool_call)则现场补建
                let toolBlock = toolBlocks[data.id];
                if (!toolBlock) {
                    startStreamBubble();
                    if (currentTextSection) {
                        currentTextSection.innerHTML = renderMarkdown(streamText);
                        if (!currentTextSection.textContent.trim()) {
                            currentTextSection.remove();
                        }
                    }
                    const toolName = escapeHtml(data.name_cn || data.name || '工具');
                    let bodyHtml = '';
                    if (data.input != null && !(typeof data.input === 'object' && Object.keys(data.input).length === 0)) {
                        bodyHtml += `<div class="tool-section"><div class="tool-label">输入参数</div><pre>${jsonPretty(data.input)}</pre></div>`;
                    }
                    toolBlock = document.createElement('div');
                    toolBlock.className = 'tool-block';
                    toolBlock.innerHTML = `
                    <div class="tool-header" onclick="toggleTool(this)" data-name="${toolName}"><span class="tool-arrow">▸</span> 🔧 ${toolName}</div>
                    <div class="tool-body">${bodyHtml}</div>`;
                    streamBubble.appendChild(toolBlock);
                    toolBlocks[data.id] = toolBlock;
                    const newTextSection = document.createElement('div');
                    newTextSection.className = 'text-section';
                    streamBubble.appendChild(newTextSection);
                    currentTextSection = newTextSection;
                    streamText = '';
                } else {
                    toolBlock.classList.remove('pending');
                    const status = toolBlock.querySelector('.tool-status');
                    if (status) status.remove();
                }
                const outSection = document.createElement('div');
                outSection.className = 'tool-section';
                outSection.innerHTML = `<div class="tool-label">输出结果</div><pre>${jsonPretty(data.content)}</pre>`;
                toolBlock.querySelector('.tool-body').appendChild(outSection);
                messagesEl.scrollTop = messagesEl.scrollHeight;
                break;
            }
            case 'delta':
                appendDelta(data.content || '');
                break;
            case 'message':
                // Update current text section with complete message content
                if (currentTextSection) {
                    currentTextSection.innerHTML = renderMarkdown(data.content);
                }
                break;
            case 'message_end':
                finishStreamBubble();
                break;
            case 'error':
                appendInlineError(data.content);
                break;
            case 'done':
                finishStreamBubble();
                setSending(false);
                break;
        }
    }

    async function streamChat(text) {
        abortCtrl = new AbortController();
        toolBlocks = {};
        try {
            const resp = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({content: text, session_id: currentSession || null}),
                signal: abortCtrl.signal,
            });
            if (!resp.ok || !resp.body) {
                appendInlineError('请求失败: ' + resp.status);
                return;
            }
            const reader = resp.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';
            let currentEvent = '';
            while (true) {
                const {value, done} = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, {stream: true});
                const parts = buffer.split('\n\n');
                buffer = parts.pop();
                for (const part of parts) {
                    let eventType = '';
                    let dataStr = '';
                    for (const line of part.split('\n')) {
                        if (line.startsWith('event: ')) eventType = line.slice(7);
                        else if (line.startsWith('data: ')) dataStr = line.slice(6);
                    }
                    if (!eventType) continue;
                    if (eventType === 'done') {
                        handleEvent({type: 'done'});
                        continue;
                    }
                    try {
                        handleEvent(JSON.parse(dataStr));
                    } catch { /* ignore malformed */
                    }
                }
            }
        } catch (e) {
            if (e.name !== 'AbortError') {
                appendInlineError('连接错误: ' + e);
            } else {
                finishStreamBubble();
                setSending(false);
            }
        } finally {
            abortCtrl = null;
        }
    }

    function autoResize() {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    }

    function send() {
        if (sending) return;
        const text = inputEl.value.trim();
        if (!text) return;
        if (emptyEl.parentNode) emptyEl.remove();
        addBubble('user', escapeHtml(text), 'user');
        inputEl.value = '';
        autoResize();
        setSending(true);
        streamChat(text);
    }

    inputEl.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            send();
        }
    });
    inputEl.addEventListener('input', autoResize);
    sendBtn.addEventListener('click', send);

    $('resetBtn').addEventListener('click', async () => {
        if (!confirm('确认清空当前会话记录?')) return;
        if (abortCtrl) abortCtrl.abort();
        if (currentSession) {
            try {
                await fetch(`/api/sessions/${currentSession}/messages`, {method: 'DELETE'});
            } catch {
            }
        }
        streamWrap = null;
        streamBubble = null;
        currentTextSection = null;
        streamText = '';
        toolBlocks = {};
        messagesEl.innerHTML = '';
        messagesEl.appendChild(typingEl);
        messagesEl.appendChild(emptyEl);
    });

    document.addEventListener('click', e => {
        const sug = e.target.closest('.suggestion');
        if (sug) {
            inputEl.value = sug.textContent;
            autoResize();
            inputEl.focus();
            send();
        }
    });

    /* ---- Voice input (Web Speech API, continuous streaming) ---- */
    // 边说边识别:continuous 持续模式 + interimResults 中间结果实时回显。
    // 点击开始 -> 边说边出字 -> 再点停止。长时间静音浏览器会自动 onend,
    // 此时若非用户主动停止则自动重启,保证持续识别不中断。
    const micBtn = $('micBtn');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;
    let manualStop = false;   // true = 用户主动停止,onend 不自动重启
    let finalTranscript = '';

    if (!SpeechRecognition) {
        micBtn.classList.add('hidden');
    } else {
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN';
        recognition.interimResults = true;
        recognition.continuous = true;   // 持续识别:停顿不结束,边说边出字
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
            isRecording = true;
            micBtn.classList.add('recording');
        };

        recognition.onresult = (e) => {
            let interim = '';
            for (let i = e.resultIndex; i < e.results.length; i++) {
                if (e.results[i].isFinal) {
                    finalTranscript += e.results[i][0].transcript;
                } else {
                    interim += e.results[i][0].transcript;
                }
            }
            inputEl.value = finalTranscript + interim;
            autoResize();
            inputEl.scrollTop = inputEl.scrollHeight; // 跟随到最新字
        };

        recognition.onend = () => {
            if (!manualStop) {
                // 超时/静音导致的自动结束,重启以保持持续识别
                try { recognition.start(); } catch (_) { /* 正在结束,忽略 */ }
                return;
            }
            isRecording = false;
            micBtn.classList.remove('recording');
        };

        recognition.onerror = (e) => {
            if (e.error === 'no-speech' || e.error === 'aborted') return; // 静默,由 onend 重启
            // 权限/硬件/网络类错误:停止且不自动重启,避免无效重试
            manualStop = true;
            isRecording = false;
            micBtn.classList.remove('recording');
            console.warn('Speech recognition error:', e.error);
        };

        micBtn.addEventListener('click', () => {
            if (isRecording) {
                manualStop = true;
                recognition.stop();
            } else {
                manualStop = false;
                finalTranscript = '';
                inputEl.value = '';
                autoResize();
                try { recognition.start(); } catch (_) { /* 已在运行则忽略 */ }
            }
        });
    }

    autoResize();
</script>
</body>
</html>
