<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Agent · 物联网智能助手</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #e6edf3;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .app {
            width: 100%;
            max-width: 920px;
            height: min(90vh, 760px);
            background: rgba(22, 27, 34, 0.78);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            box-shadow: 0 18px 60px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            padding: 16px 22px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.25);
        }
        .logo {
            width: 38px; height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: grid; place-items: center;
            font-size: 20px;
            box-shadow: 0 4px 14px rgba(79, 172, 254, 0.4);
        }
        header h1 { font-size: 16px; font-weight: 600; }
        header .sub { font-size: 11px; color: #8b949e; margin-top: 2px; }
        .session-bar { margin-left: auto; display: flex; gap: 8px; align-items: center; }
        select, button {
            background: rgba(255,255,255,0.06);
            color: #e6edf3;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }
        select:hover, button:hover { background: rgba(255,255,255,0.12); }
        button.primary {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border: none; color: #06203a; font-weight: 600;
        }
        button.primary:hover { filter: brightness(1.08); }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .messages::-webkit-scrollbar { width: 8px; }
        .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

        .msg { display: flex; gap: 10px; max-width: 86%; align-items: flex-start; }
        .msg .avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            display: grid; place-items: center;
            font-size: 14px; flex-shrink: 0;
        }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.user .avatar { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
        .msg.assistant .avatar { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #06203a; }
        .bubble {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
        }
        .msg.user .bubble { background: linear-gradient(135deg, #a18cd1, #fbc2eb); color: #1a1033; }
        .msg.assistant .bubble { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.08); }

        /* ---- Markdown styles inside assistant bubbles ---- */
        .msg.assistant .bubble p { margin: 0 0 8px; }
        .msg.assistant .bubble p:last-child { margin-bottom: 0; }
        .msg.assistant .bubble ul, .msg.assistant .bubble ol { margin: 0 0 8px; padding-left: 20px; }
        .msg.assistant .bubble li { margin: 2px 0; }
        .msg.assistant .bubble h1, .msg.assistant .bubble h2, .msg.assistant .bubble h3,
        .msg.assistant .bubble h4, .msg.assistant .bubble h5, .msg.assistant .bubble h6 {
            margin: 12px 0 6px; font-weight: 600; line-height: 1.3;
        }
        .msg.assistant .bubble h1 { font-size: 1.3em; }
        .msg.assistant .bubble h2 { font-size: 1.15em; }
        .msg.assistant .bubble h3 { font-size: 1.05em; }
        .msg.assistant .bubble blockquote {
            margin: 8px 0; padding: 6px 12px;
            border-left: 3px solid #4facfe;
            background: rgba(79,172,254,0.08);
            border-radius: 0 6px 6px 0;
        }
        .msg.assistant .bubble code {
            background: rgba(255,255,255,0.1);
            padding: 2px 6px; border-radius: 4px;
            font-family: "JetBrains Mono", Consolas, monospace;
            font-size: 0.88em;
        }
        .msg.assistant .bubble pre {
            margin: 8px 0; padding: 0;
            background: rgba(0,0,0,0.35);
            border-radius: 8px;
            overflow: hidden;
        }
        .msg.assistant .bubble pre code {
            display: block; padding: 12px 14px;
            background: transparent; overflow-x: auto;
            font-size: 0.85em; line-height: 1.5;
        }
        .msg.assistant .bubble table {
            margin: 8px 0; border-collapse: collapse; font-size: 0.9em; width: 100%;
        }
        .msg.assistant .bubble th, .msg.assistant .bubble td {
            border: 1px solid rgba(255,255,255,0.15);
            padding: 6px 10px; text-align: left;
        }
        .msg.assistant .bubble th { background: rgba(255,255,255,0.08); font-weight: 600; }
        .msg.assistant .bubble hr { border: none; border-top: 1px solid rgba(255,255,255,0.15); margin: 10px 0; }
        .msg.assistant .bubble a { color: #4facfe; text-decoration: underline; }
        .msg.assistant .bubble img { max-width: 100%; border-radius: 6px; }
        .msg.assistant .bubble strong { font-weight: 700; }
        .msg.assistant .bubble em { font-style: italic; }

        .msg.tool .bubble {
            background: rgba(255, 200, 80, 0.10);
            border: 1px dashed rgba(255, 200, 80, 0.4);
            font-family: "JetBrains Mono", Consolas, monospace;
            font-size: 12px;
            color: #ffe1a3;
        }
        .msg.tool .avatar { background: linear-gradient(135deg, #f6d365, #fda085); color: #3a2300; }
        .tool-name {
            font-size: 11px;
            color: #f6d365;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .tool-output {
            max-height: 200px;
            overflow: auto;
            white-space: pre-wrap;
        }

        .error .bubble { background: rgba(255, 80, 80, 0.16); border: 1px solid rgba(255, 80, 80, 0.4); color: #ffb3b3; }
        .error .avatar { background: linear-gradient(135deg, #ff5858, #f09819); }

        .typing { display: none; gap: 6px; padding: 4px 10px; }
        .typing.show { display: flex; }
        .typing span {
            width: 8px; height: 8px; border-radius: 50%;
            background: #4facfe;
            animation: blink 1.4s infinite both;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

        .input-bar {
            border-top: 1px solid rgba(255,255,255,0.08);
            padding: 14px 18px;
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.25);
        }
        textarea {
            flex: 1;
            resize: none;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            color: #e6edf3;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            line-height: 1.5;
            max-height: 120px;
            transition: border-color 0.15s;
        }
        textarea:focus { outline: none; border-color: #4facfe; }
        .send-btn {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #06203a;
            border: none;
            border-radius: 12px;
            padding: 0 18px;
            font-size: 14px; font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .send-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .empty {
            justify-content: center;
            color: #6e7681;
            text-align: center;
            margin: auto;
            padding: 40px;
        }
        .empty .big { font-size: 40px; margin-bottom: 10px; }
        .empty .hint { font-size: 13px; line-height: 1.7; }
        .suggestion {
            display: inline-block;
            margin: 4px 4px 0;
            padding: 6px 12px;
            font-size: 12px;
            background: rgba(79, 172, 254, 0.12);
            border: 1px solid rgba(79, 172, 254, 0.3);
            color: #9fd6ff;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .suggestion:hover { background: rgba(79, 172, 254, 0.25); }
        .cursor {
            display: inline-block;
            width: 7px;
            margin-left: 2px;
            color: #4facfe;
            animation: cursorBlink 1s steps(2) infinite;
        }
        @keyframes cursorBlink { 50% { opacity: 0; } }
    </style>
</head>
<body>
<div class="app">
    <header>
        <div class="logo">🛠</div>
        <div>
            <h1>IoT Agent</h1>
            <div class="sub">物联网平台智能助手 · qwen-plus</div>
        </div>
        <div class="session-bar">
            <select id="sessionSelect"><option value="">新会话</option></select>
            <button id="newSessionBtn" class="primary">+ 新建</button>
            <button id="resetBtn">清空</button>
        </div>
    </header>

    <div class="messages" id="messages">
        <div class="empty" id="empty">
            <div class="big">📡</div>
            <div>你可以问我物联网平台相关操作，例如：</div>
            <div style="margin-top:10px">
                <span class="suggestion">查询当前项目下所有的设备产品列表</span>
                <span class="suggestion">查看 productKey 为 a1xxx 的物模型</span>
                <span class="suggestion">查询设备列表前 20 条</span>
                <span class="suggestion">给设备 iotId xxx 设置温度为 66</span>
            </div>
        </div>
        <div class="typing" id="typing"><span></span><span></span><span></span></div>
    </div>

    <div class="input-bar">
        <textarea id="input" placeholder="输入你的请求,  Ctrl/⌘+Enter 发送..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn">发送</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"></script>
<script>
/* ---- Markdown renderer config ---- */
marked.setOptions({
    breaks: true,
    gfm: true,
    highlight(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
            try { return hljs.highlight(code, { language: lang }).value; } catch {}
        }
        try { return hljs.highlightAuto(code).value; } catch {}
        return code;
    },
});

function renderMarkdown(text) {
    return marked.parse(text || '');
}

const $ = id => document.getElementById(id);
const messagesEl = $('messages');
const inputEl = $('input');
const sendBtn = $('sendBtn');
const typingEl = $('typing');
const emptyEl = $('empty');
const sessionSelect = $('sessionSelect');
let currentSession = '';
let sending = false;
let streamBubble = null;
let streamText = '';
let abortCtrl = null;

function startStreamBubble() {
    if (streamBubble) return streamBubble;
    toggleTyping(false);
    streamText = '';
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant';
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'AI';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<span class="cursor">▋</span>';
    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    streamBubble = bubble;
    return bubble;
}

function appendDelta(text) {
    startStreamBubble();
    streamText += text;
    streamBubble.innerHTML = renderMarkdown(streamText) + '<span class="cursor">▋</span>';
    messagesEl.scrollTop = messagesEl.scrollHeight;
}

function finishStreamBubble() {
    if (streamBubble) {
        streamBubble.innerHTML = renderMarkdown(streamText);
        streamBubble = null;
        streamText = '';
    }
}

function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function jsonPretty(v) {
    if (typeof v === 'string') return escapeHtml(v);
    try { return escapeHtml(JSON.stringify(v, null, 2)); }
    catch { return escapeHtml(String(v)); }
}

function addBubble(role, html, kind) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (kind || role);
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '我' : (kind === 'tool' ? '⚙' : 'AI');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = html;
    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
}

function showTool(name, content) {
    const wrap = document.createElement('div');
    wrap.className = 'msg tool';
    wrap.innerHTML = `
        <div class="avatar">⚙</div>
        <div class="bubble">
            <div class="tool-name">🔧 ${escapeHtml(name)}</div>
            <pre class="tool-output">${jsonPretty(content)}</pre>
        </div>`;
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showError(text) {
    addBubble('error', escapeHtml(text), 'error');
}

function toggleTyping(show) {
    typingEl.classList.toggle('show', show && !sending);
}

function setSending(v) {
    sending = v;
    sendBtn.disabled = v;
    toggleTyping(v);
}

function handleEvent(data) {
    switch (data.type) {
        case 'session':
            currentSession = data.session_id;
            if (![...sessionSelect.options].some(o => o.value === currentSession)) {
                const opt = document.createElement('option');
                opt.value = currentSession;
                opt.textContent = currentSession.slice(0, 8);
                sessionSelect.appendChild(opt);
            }
            sessionSelect.value = currentSession;
            break;
        case 'tool':
            finishStreamBubble();
            showTool(data.name || '工具', data.content);
            break;
        case 'delta':
            appendDelta(data.content || '');
            break;
        case 'message':
            finishStreamBubble();
            addBubble('assistant', renderMarkdown(data.content));
            break;
        case 'message_end':
            finishStreamBubble();
            break;
        case 'error':
            finishStreamBubble();
            showError(data.content);
            setSending(false);
            break;
        case 'done':
            finishStreamBubble();
            setSending(false);
            break;
    }
}

async function streamChat(text) {
    abortCtrl = new AbortController();
    try {
        const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: text, session_id: currentSession || null }),
            signal: abortCtrl.signal,
        });
        if (!resp.ok || !resp.body) {
            showError(`请求失败: ${resp.status}`);
            setSending(false);
            return;
        }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';
        while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop();
            for (const line of lines) {
                const payload = line.trim();
                if (!payload) continue;
                try { handleEvent(JSON.parse(payload)); }
                catch { /* ignore malformed */ }
            }
        }
        if (buffer.trim()) {
            const payload = buffer.trim();
            try { handleEvent(JSON.parse(payload)); } catch {}
        }
    } catch (e) {
        if (e.name !== 'AbortError') showError(`连接错误: ${e}`);
        finishStreamBubble();
        setSending(false);
    } finally {
        abortCtrl = null;
    }
}

async function loadSessions() {
    try {
        const resp = await fetch('/api/sessions');
        const data = await resp.json();
        sessionSelect.innerHTML = '<option value="">新会话</option>';
        (data.sessions || []).forEach(sid => {
            const opt = document.createElement('option');
            opt.value = sid; opt.textContent = sid.slice(0, 8);
            sessionSelect.appendChild(opt);
        });
    } catch {}
}

async function loadHistory(sid) {
    if (!sid) { location.reload(); return; }
    try {
        const resp = await fetch(`/api/sessions/${sid}/messages`);
        const data = await resp.json();
        messagesEl.innerHTML = '';
        typingEl.classList.remove('show');
        streamBubble = null;
        streamText = '';
        messagesEl.appendChild(typingEl);
        if (!data.messages || data.messages.length === 0) {
            messagesEl.insertBefore(emptyEl, typingEl);
        } else {
            data.messages.forEach(m => {
                if (m.role === 'assistant') addBubble(m.role, renderMarkdown(m.content));
                else addBubble(m.role, escapeHtml(m.content));
            });
        }
    } catch {}
}

function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
}

function send() {
    if (sending) return;
    const text = inputEl.value.trim();
    if (!text) return;
    if (emptyEl.parentNode) emptyEl.remove();
    addBubble('user', escapeHtml(text), 'user');
    inputEl.value = '';
    autoResize();
    setSending(true);
    streamChat(text);
}

inputEl.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        send();
    }
});
inputEl.addEventListener('input', autoResize);
sendBtn.addEventListener('click', send);

$('newSessionBtn').addEventListener('click', () => {
    if (abortCtrl) abortCtrl.abort();
    currentSession = '';
    sessionSelect.value = '';
    streamBubble = null;
    streamText = '';
    messagesEl.innerHTML = '';
    typingEl.classList.remove('show');
    messagesEl.appendChild(emptyEl);
    messagesEl.appendChild(typingEl);
});

$('resetBtn').addEventListener('click', async () => {
    if (!currentSession) return;
    if (!confirm('确认清空当前会话记录?')) return;
    if (abortCtrl) abortCtrl.abort();
    try {
        await fetch(`/api/sessions/${currentSession}/messages`, { method: 'DELETE' });
    } catch {}
    streamBubble = null;
    streamText = '';
    messagesEl.innerHTML = '';
    messagesEl.appendChild(typingEl);
    messagesEl.appendChild(emptyEl);
});

sessionSelect.addEventListener('change', () => {
    if (abortCtrl) abortCtrl.abort();
    currentSession = sessionSelect.value;
    if (currentSession) loadHistory(currentSession);
});

document.addEventListener('click', e => {
    if (e.target.classList.contains('suggestion')) {
        inputEl.value = e.target.textContent;
        autoResize();
        inputEl.focus();
    }
});

loadSessions();
autoResize();
</script>
</body>
</html>
